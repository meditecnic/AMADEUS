name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  eol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check repository line endings
        run: |
          git add --renormalize .
          git diff --cached --name-only --exit-code

  frontend:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: desktop
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run build
      - id: tests
        run: npm test -- --maxWorkers=2 --reporter=default --reporter=junit --outputFile.junit="$env:RUNNER_TEMP\junit-frontend.xml"
      - name: Summarize test results
        if: ${{ !cancelled() }}
        run: python ../.github/scripts/test_summary.py --label frontend --junit "$env:RUNNER_TEMP\junit-frontend.xml" --outcome "${{ steps.tests.outcome }}"

  backend:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Print environment information
        run: |
          python --version
          chcp
          python -c "import locale, sys; print(locale.getpreferredencoding(False)); print(sys.stdout.encoding)"
          $codePage = (chcp) -replace '.*?([0-9]+)\s*$', '$1'
          python -c "import locale, sys; print('::notice title=backend env::Python ' + sys.version.split()[0] + ' | chcp ' + sys.argv[1] + ' | preferred encoding ' + locale.getpreferredencoding(False) + ' | stdout encoding ' + str(sys.stdout.encoding))" $codePage
      - run: python -m pytest --collect-only -q
      - name: Create pytest temporary parent directory
        run: New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP '测试 临时') -Force | Out-Null
      - id: tests
        run: python -m pytest -q -rfEsx --basetemp "$env:RUNNER_TEMP\测试 临时\run" --junitxml "$env:RUNNER_TEMP\junit-backend.xml"
      - name: Summarize test results
        if: ${{ !cancelled() }}
        run: python ../.github/scripts/test_summary.py --label backend --junit "$env:RUNNER_TEMP\junit-backend.xml" --outcome "${{ steps.tests.outcome }}"

  backend-py313:
    runs-on: windows-latest
    timeout-minutes: 60
    continue-on-error: true
    defaults:
      run:
        shell: pwsh
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Print environment information
        run: |
          python --version
          chcp
          python -c "import locale, sys; print(locale.getpreferredencoding(False)); print(sys.stdout.encoding)"
          $codePage = (chcp) -replace '.*?([0-9]+)\s*$', '$1'
          python -c "import locale, sys; print('::notice title=backend-py313 env::Python ' + sys.version.split()[0] + ' | chcp ' + sys.argv[1] + ' | preferred encoding ' + locale.getpreferredencoding(False) + ' | stdout encoding ' + str(sys.stdout.encoding))" $codePage
      - run: python -m pytest --collect-only -q
      - name: Create pytest temporary parent directory
        run: New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP '测试 临时') -Force | Out-Null
      - id: tests
        run: python -m pytest -q -rfEsx --basetemp "$env:RUNNER_TEMP\测试 临时\run" --junitxml "$env:RUNNER_TEMP\junit-backend.xml"
      - name: Summarize test results
        if: ${{ !cancelled() }}
        run: python ../.github/scripts/test_summary.py --label backend-py313 --junit "$env:RUNNER_TEMP\junit-backend.xml" --level warning --outcome "${{ steps.tests.outcome }}"
