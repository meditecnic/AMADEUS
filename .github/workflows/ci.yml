name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  eol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Check repository line endings
        run: |
          git add --renormalize .
          git diff --cached --name-only --exit-code

  frontend:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: desktop
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --maxWorkers=2

  backend:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Print environment information
        run: |
          python --version
          chcp
          python -c "import locale, sys; print(locale.getpreferredencoding(False)); print(sys.stdout.encoding)"
      - run: python -m pytest --collect-only -q
      - name: Create pytest temporary parent directory
        run: New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP '测试 临时') -Force | Out-Null
      - run: python -m pytest -q -rfEsx --basetemp "$env:RUNNER_TEMP\测试 临时\run"

  backend-py313:
    runs-on: windows-latest
    timeout-minutes: 60
    continue-on-error: true
    defaults:
      run:
        shell: pwsh
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Print environment information
        run: |
          python --version
          chcp
          python -c "import locale, sys; print(locale.getpreferredencoding(False)); print(sys.stdout.encoding)"
      - run: python -m pytest --collect-only -q
      - name: Create pytest temporary parent directory
        run: New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP '测试 临时') -Force | Out-Null
      - run: python -m pytest -q -rfEsx --basetemp "$env:RUNNER_TEMP\测试 临时\run"
