name: Windows release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'packaging/**'
      - 'desktop/src-tauri/**'
      - 'desktop/package*.json'
      - 'backend/requirements*'
      - '.github/workflows/release.yml'
      - '.github/release-template.md'
  workflow_dispatch:
    inputs:
      smoke_run_id:
        description: 'Optional earlier run ID: smoke its installer artifact without rebuilding'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.smoke_run_id == ''
    outputs:
      version: ${{ steps.version.outputs.version }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      JINA_REVISION: ac5d898c8d382b17167c33e5c8af644a3519b47d
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          architecture: x64
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - id: version
        name: Validate release inputs
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.event_name != 'pull_request' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
        run: python packaging/windows/release_artifacts.py check >> $env:GITHUB_OUTPUT
      - name: Prepare build tools
        run: |
          "BUILD_WORK=$env:RUNNER_TEMP/amadeus-build" >> $env:GITHUB_ENV
          "RELEASE_DIR=$env:RUNNER_TEMP/amadeus-release" >> $env:GITHUB_ENV
          python -m pip install huggingface_hub==2.4.0 pytest==9.2.0 ruff==0.17.2 pefile==2024.8.26 websocket-client==1.9.0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustup show active-toolchain
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -c "import sys; sys.path.insert(0, 'packaging/windows'); from build_installer import visual_studio; from bundle_support import sanitized_build_environment; print(visual_studio(sanitized_build_environment())['redist'])" | Select-Object -Last 1 | ForEach-Object { "VC_REDIST=$_" >> $env:GITHUB_ENV }
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/jina-snapshot/${{ env.JINA_REVISION }}
          key: jina-${{ runner.os }}-${{ env.JINA_REVISION }}
      - name: Download pinned Jina snapshot
        # The builder requires the snapshot directory to be named after the pinned revision.
        # Filenames are positional: `--include a b c` would take only the first as a pattern.
        run: hf download jinaai/jina-embeddings-v5-text-nano-retrieval onnx/model.onnx onnx/model.onnx_data tokenizer.json README.md --revision $env:JINA_REVISION --local-dir "$env:RUNNER_TEMP/jina-snapshot/$env:JINA_REVISION"
      - name: Install locked update signature verifier
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r packaging/windows/requirements-verify.lock
      - name: Packaging tests and lint
        run: |
          python -m pytest -q packaging/windows/tests
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ruff check --config backend/ruff.toml packaging/windows
      - name: Build with existing installer builder
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.event_name != 'pull_request' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: python packaging/windows/build_installer.py --work-dir $env:BUILD_WORK --embedding-source "$env:RUNNER_TEMP/jina-snapshot/$env:JINA_REVISION" --vc-redist $env:VC_REDIST
      - name: Frozen service and self-check refuse missing data directory
        run: |
          $result = Get-Content "$env:BUILD_WORK/installer-result.json" -Raw | ConvertFrom-Json
          python packaging/windows/check_no_data_dir.py --exe "$($result.backend)/amadeus-backend.exe" --work-dir "$env:RUNNER_TEMP/release-no-data-dir"
      - name: Frozen backend self-check and smoke
        run: |
          $result = Get-Content "$env:BUILD_WORK/installer-result.json" -Raw | ConvertFrom-Json
          $env:AMADEUS_DATA_DIR = "$env:RUNNER_TEMP/release-self-check-data"
          $env:AMADEUS_CREDENTIAL_BACKEND = 'memory'
          $env:PYTHON_DOTENV_DISABLED = '1'
          $env:AMADEUS_LOCAL_API_TOKEN = 'ci-self-check-only'
          & "$($result.backend)/amadeus-backend.exe" --self-check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$env:BUILD_WORK/backend-build/venv/Scripts/python.exe" packaging/windows/smoke_frozen.py --exe "$($result.backend)/amadeus-backend.exe" --work-dir "$env:RUNNER_TEMP/release-smoke"
      - name: Collect release files and checksums
        run: python packaging/windows/release_artifacts.py collect --work-dir $env:BUILD_WORK --output $env:RELEASE_DIR
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: amadeus-windows-x64-${{ steps.version.outputs.version }}
          path: ${{ env.RELEASE_DIR }}/*
          if-no-files-found: error
      - name: Summarize DLL exclusion and license download retries
        if: always()
        run: |
          if (-not $env:BUILD_WORK -or -not (Test-Path $env:BUILD_WORK)) {
            'Build has not run; license download retry status is unavailable.' >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          $retries = @(Get-ChildItem $env:BUILD_WORK -Recurse -Filter *.log -ErrorAction SilentlyContinue | Select-String 'DOWNLOAD_RETRY')
          "License/source DOWNLOAD_RETRY lines: $($retries.Count) (see build logs)." >> $env:GITHUB_STEP_SUMMARY
          $auditPath = "$env:BUILD_WORK/backend-build/onnxruntime-imports.json"
          if (Test-Path $auditPath) {
            $audit = Get-Content $auditPath -Raw | ConvertFrom-Json
            "ORT pruning: $($audit.before.bytes) -> $($audit.after.bytes) bytes; $(@($audit.removed).Count) files removed." >> $env:GITHUB_STEP_SUMMARY
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: windows-packaging-evidence
          path: |
            ${{ runner.temp }}/amadeus-build/installer-result.json
            ${{ runner.temp }}/amadeus-build/backend-build/*.json
            ${{ runner.temp }}/amadeus-build/runs/**/logs/*.log
          if-no-files-found: ignore

  install-smoke:
    needs: windows
    # A skipped build is allowed only for an explicit earlier-run replay.
    if: >-
      always() && !cancelled() &&
      (needs.windows.result == 'success' ||
       (needs.windows.result == 'skipped' && github.event_name == 'workflow_dispatch' && inputs.smoke_run_id != ''))
    runs-on: windows-2025-vs2026
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          architecture: x64
      - name: Validate optional source run
        env:
          SOURCE_RUN: ${{ inputs.smoke_run_id }}
        run: |
          if ($env:SOURCE_RUN -and $env:SOURCE_RUN -notmatch '^[1-9][0-9]*$') {
            throw 'smoke_run_id must be a positive numeric workflow run ID'
          }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: amadeus-windows-x64-*
          path: ${{ runner.temp }}/smoke-installer
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ inputs.smoke_run_id || github.run_id }}
      - name: Install smoke dependencies and run logical tests
        run: |
          python -m pip install websocket-client==1.9.0 pytest==9.2.0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pytest -q packaging/windows/tests/test_install_smoke.py
      - name: Install, login, close and uninstall
        run: |
          $installers = @(Get-ChildItem "$env:RUNNER_TEMP/smoke-installer" -Recurse -Filter '*_x64-setup.exe')
          if ($installers.Count -ne 1) { throw "Expected one installer artifact, found $($installers.Count)" }
          python packaging/windows/install_smoke.py --installer $installers[0].FullName --evidence-dir "$env:RUNNER_TEMP/install-smoke-evidence" 2>&1 | Tee-Object "$env:RUNNER_TEMP/install-smoke-console.log"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: windows-install-smoke-evidence
          path: |
            ${{ runner.temp }}/install-smoke-evidence/*
            ${{ runner.temp }}/install-smoke-console.log
          if-no-files-found: warn

  draft-release:
    needs: [windows, install-smoke]
    if: >-
      always() && !cancelled() && needs.install-smoke.result == 'success' &&
      (needs.windows.result == 'success' ||
       (needs.windows.result == 'skipped' && github.event_name == 'workflow_dispatch' && inputs.smoke_run_id != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: amadeus-windows-x64-*
          path: release-files
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ inputs.smoke_run_id || github.run_id }}
      - name: Explain unsigned PR verification skip
        if: github.event_name == 'pull_request'
        run: echo 'UPDATE_SIGNATURE_SKIPPED — PR builds do not receive signing secrets or generate update signatures.'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: github.event_name != 'pull_request'
        with:
          python-version: '3.11'
      - name: Install locked update signature verifier
        if: github.event_name != 'pull_request'
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r packaging/windows/requirements-verify.lock
      - name: Verify update signature before creating a Release
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          shopt -s nullglob
          installers=(release-files/*_x64-setup.exe)
          if [[ ${#installers[@]} -ne 1 ]]; then
            echo 'UPDATE_SIGNATURE_FAILED: expected exactly one Windows installer' >&2
            exit 1
          fi
          python packaging/windows/verify_update_signature.py \
            --installer "${installers[0]}" --signature "${installers[0]}.sig" \
            --config desktop/src-tauri/tauri.conf.json --latest release-files/latest.json
      - name: Create draft Release for tag pushes after install smoke
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.windows.outputs.version }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          text = Path('.github/release-template.md').read_text(encoding='utf-8')
          Path('release-notes.md').write_text(text.replace('<版本>', os.environ['RELEASE_VERSION']), encoding='utf-8')
          PY
          gh release create "$RELEASE_TAG" release-files/* --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "Amadeus $RELEASE_VERSION" --notes-file release-notes.md
