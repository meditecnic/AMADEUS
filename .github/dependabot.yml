version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/desktop"
    schedule:
      interval: "monthly"
    groups:
      npm:
        patterns:
          - "*"
# No pip updates: backend/requirements-dev.lock contains hashes and is generated
# by uv. Dependabot edits would conflict with the backend-lock CI check.
