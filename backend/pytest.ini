[pytest]
testpaths = tests
python_files = test_*.py
asyncio_mode = auto
markers =
    integration: requires local sidecars or network access
    live_memory_eval: non-deterministic LLM memory quality evaluation; metrics warn but do not gate ordinary CI
    gpu: requires a local CUDA-capable model runtime
filterwarnings =
    error::pytest.PytestUnhandledThreadExceptionWarning
